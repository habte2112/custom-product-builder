<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog — Custom Product Builder</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #0f0f0f;
      border-bottom: 1px solid #2a2a2a;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      color: #ff9900;
    }

    .nav-links { display: flex; gap: 24px; align-items: center; }

    .nav-links a {
      color: #888;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active { color: #ff9900; }

    /* ── Main ── */
    main { max-width: 1200px; margin: 40px auto; padding: 0 30px; }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* ── Wishlist toggle button ── */
    .btn-wishlist-toggle {
      background: none;
      border: 1px solid #2a2a2a;
      color: #888;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-wishlist-toggle:hover { border-color: #ff9900; color: #ff9900; }
    .btn-wishlist-toggle.active { background: rgba(255,153,0,0.1); border-color: #ff9900; color: #ff9900; }

    .wishlist-count {
      background: #ff9900;
      color: #000;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      min-width: 18px;
      text-align: center;
    }

    /* ── Search bar ── */
    .search-wrap {
      position: relative;
      margin-bottom: 24px;
    }

    .search-wrap input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px 20px 16px 50px;
      color: #f0f0f0;
      font-size: 16px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-wrap input:focus {
      border-color: #ff9900;
      box-shadow: 0 0 0 3px rgba(255,153,0,0.1);
    }

    .search-wrap input::placeholder { color: #444; }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      pointer-events: none;
    }

    .search-clear {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #555;
      font-size: 20px;
      cursor: pointer;
      display: none;
      transition: color 0.2s;
    }

    .search-clear:hover { color: #ff9900; }

    /* ── Category filters ── */
    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .filter-btn {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #888;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }

    .filter-btn:hover { border-color: #ff9900; color: #ff9900; }
    .filter-btn.active { background: #ff9900; border-color: #ff9900; color: #000; }

    /* ── Results count ── */
    .results-count { font-size: 13px; color: #555; margin-bottom: 20px; }

    /* ── Product grid ── */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    /* ── Product card ── */
    .product-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: #ff9900;
      box-shadow: 0 8px 24px rgba(255,153,0,0.15);
    }

    /* ── Wishlist heart button ── */
    .wishlist-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
      z-index: 2;
      backdrop-filter: blur(4px);
    }

    .wishlist-btn:hover { background: rgba(255,153,0,0.3); transform: scale(1.1); }
    .wishlist-btn.wishlisted { background: rgba(229,62,62,0.3); }

    .card-image {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: #0f0f0f;
      padding: 20px;
    }

    .card-body { padding: 16px; }

    .card-category {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ff9900;
      margin-bottom: 6px;
    }

    .card-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      color: #f0f0f0;
      margin-bottom: 6px;
    }

    .card-description {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    /* ── Star rating on card ── */
    .card-rating {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .card-stars { color: #ff9900; font-size: 13px; }
    .card-rating-count { font-size: 12px; color: #555; }
    .no-reviews { font-size: 12px; color: #444; }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-price {
      font-size: 20px;
      font-weight: 700;
      color: #ff9900;
    }

    .btn-customize {
      background: #ff9900;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-customize:hover { background: #ffb84d; }

    /* ── No results ── */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #444;
    }

    .no-results p:first-child { font-size: 48px; margin-bottom: 16px; }
    .no-results p:last-child  { font-size: 16px; }

    /* ── Wishlist empty ── */
    .wishlist-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #444;
    }

    .wishlist-empty .icon { font-size: 48px; margin-bottom: 16px; }
    .wishlist-empty p { font-size: 16px; margin-bottom: 20px; }

    .btn-browse {
      display: inline-block;
      background: #ff9900;
      color: #000;
      padding: 10px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: background 0.2s;
    }

    .btn-browse:hover { background: #ffb84d; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      main   { padding: 0 16px; margin: 24px auto; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Product Catalog</h1>
    <nav class="nav-links" id="main-nav">
      <a href="index.html">Builder</a>
      <a href="catalog.html" class="active">Catalog</a>
      <a href="order-history.html">Orders</a>
    </nav>
  </header>

  <main>

    <!-- Top bar -->
    <div class="top-bar">
      <div></div>
      <!-- Wishlist toggle -->
      <button class="btn-wishlist-toggle" id="btn-wishlist-toggle">
        ♡ Wishlist <span class="wishlist-count" id="wishlist-count">0</span>
      </button>
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search products...">
      <button class="search-clear" id="search-clear">✕</button>
    </div>

    <!-- Category filters -->
    <div class="filter-bar" id="filter-bar"></div>

    <!-- Results count -->
    <p class="results-count" id="results-count"></p>

    <!-- Product grid -->
    <div class="product-grid" id="product-grid"></div>

  </main>

  <script type="module">
    import { products, categories } from './scripts/products.js';
    import { setupNav } from './scripts/admin-nav.js';
    setupNav();

    const API = 'https://custom-product-backend-production.up.railway.app/api';

    const searchInput       = document.getElementById('search-input');
    const searchClear       = document.getElementById('search-clear');
    const filterBar         = document.getElementById('filter-bar');
    const productGrid       = document.getElementById('product-grid');
    const resultsCount      = document.getElementById('results-count');
    const btnWishlistToggle = document.getElementById('btn-wishlist-toggle');
    const wishlistCountEl   = document.getElementById('wishlist-count');

    let activeCategory  = 'all';
    let searchQuery     = '';
    let ratingSummary   = {};
    let showWishlistOnly = false;

    // ══════════════════════════════════════
    // WISHLIST (localStorage)
    // ══════════════════════════════════════
    function getWishlist() {
      return JSON.parse(localStorage.getItem('wishlist') || '[]');
    }

    function saveWishlist(list) {
      localStorage.setItem('wishlist', JSON.stringify(list));
      updateWishlistCount();
    }

    function isWishlisted(productKey) {
      return getWishlist().includes(productKey);
    }

    function toggleWishlist(productKey) {
      const list = getWishlist();
      const idx  = list.indexOf(productKey);
      if (idx === -1) {
        list.push(productKey);
      } else {
        list.splice(idx, 1);
      }
      saveWishlist(list);
      return idx === -1; // true = added
    }

    function updateWishlistCount() {
      const count = getWishlist().length;
      wishlistCountEl.textContent = count;
      btnWishlistToggle.classList.toggle('active', showWishlistOnly);
    }

    // Toggle wishlist view
    btnWishlistToggle.addEventListener('click', () => {
      showWishlistOnly = !showWishlistOnly;
      btnWishlistToggle.classList.toggle('active', showWishlistOnly);
      btnWishlistToggle.innerHTML = showWishlistOnly
        ? `♥ Wishlist <span class="wishlist-count" id="wishlist-count">${getWishlist().length}</span>`
        : `♡ Wishlist <span class="wishlist-count" id="wishlist-count">${getWishlist().length}</span>`;
      renderProducts();
    });

    // ══════════════════════════════════════
    // STAR RATING HELPERS
    // ══════════════════════════════════════
    function starsString(avg) {
      const full  = Math.floor(avg);
      const half  = avg % 1 >= 0.5 ? 1 : 0;
      const empty = 5 - full - half;
      return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
    }

    function ratingBadge(productKey) {
      const r = ratingSummary[productKey];
      if (!r || r.count === 0) {
        return `<div class="card-rating"><span class="no-reviews">No reviews yet</span></div>`;
      }
      return `
        <div class="card-rating">
          <span class="card-stars">${starsString(r.avg)}</span>
          <span class="card-rating-count">${r.avg} (${r.count})</span>
        </div>`;
    }

    // ══════════════════════════════════════
    // LOAD RATINGS SUMMARY
    // ══════════════════════════════════════
    async function loadRatingsSummary() {
      try {
        const res  = await fetch(`${API}/reviews/summary`);
        const data = await res.json();
        ratingSummary = data.summary || {};
      } catch {
        ratingSummary = {};
      }
    }

    // ══════════════════════════════════════
    // BUILD CATEGORY FILTER BUTTONS
    // ══════════════════════════════════════
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className     = 'filter-btn' + (cat === 'all' ? ' active' : '');
      btn.textContent   = cat === 'all' ? 'All Products' : capitalize(cat);
      btn.dataset.category = cat;

      btn.addEventListener('click', () => {
        activeCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        showWishlistOnly = false;
        btnWishlistToggle.classList.remove('active');
        btnWishlistToggle.innerHTML = `♡ Wishlist <span class="wishlist-count" id="wishlist-count">${getWishlist().length}</span>`;
        renderProducts();
      });

      filterBar.appendChild(btn);
    });

    // ══════════════════════════════════════
    // RENDER PRODUCTS
    // ══════════════════════════════════════
    function renderProducts() {
      const query    = searchQuery.toLowerCase().trim();
      const wishlist = getWishlist();

      // Filter
      const filtered = Object.entries(products).filter(([key, product]) => {
        const matchesCategory = activeCategory === 'all' || product.category === activeCategory;
        const matchesSearch   = !query ||
          product.label.toLowerCase().includes(query) ||
          product.category.toLowerCase().includes(query) ||
          product.description.toLowerCase().includes(query);
        const matchesWishlist = !showWishlistOnly || wishlist.includes(key);
        return matchesCategory && matchesSearch && matchesWishlist;
      });

      // Results count
      if (showWishlistOnly) {
        resultsCount.textContent = `${filtered.length} wishlisted product${filtered.length !== 1 ? 's' : ''}`;
      } else {
        resultsCount.textContent = `${filtered.length} product${filtered.length !== 1 ? 's' : ''} found`;
      }

      // Wishlist empty state
      if (showWishlistOnly && filtered.length === 0) {
        productGrid.innerHTML = `
          <div class="wishlist-empty">
            <div class="icon">♡</div>
            <p>Your wishlist is empty.<br>Click the ♡ on any product to save it!</p>
            <button class="btn-browse" onclick="document.getElementById('btn-wishlist-toggle').click()">
              Browse Products
            </button>
          </div>`;
        return;
      }

      // No results
      if (filtered.length === 0) {
        productGrid.innerHTML = `
          <div class="no-results">
            <p>🔍</p>
            <p>No products found for "<strong>${query}</strong>"</p>
          </div>`;
        return;
      }

      // Render cards
      productGrid.innerHTML = filtered.map(([key, product]) => {
        const wishlisted = wishlist.includes(key);
        return `
          <div class="product-card" data-key="${key}">

            <!-- Wishlist heart button -->
            <button class="wishlist-btn ${wishlisted ? 'wishlisted' : ''}"
              data-key="${key}"
              title="${wishlisted ? 'Remove from wishlist' : 'Add to wishlist'}">
              ${wishlisted ? '♥' : '♡'}
            </button>

            <img class="card-image" src="${product.image}" alt="${product.label}">

            <div class="card-body">
              <div class="card-category">${product.category}</div>
              <div class="card-name">${product.label}</div>
              <div class="card-description">${product.description}</div>

              <!-- Star rating -->
              ${ratingBadge(key)}

              <div class="card-footer">
                <span class="card-price">$${product.price.toFixed(2)}</span>
                <button class="btn-customize" data-key="${key}">Customize →</button>
              </div>
            </div>
          </div>`;
      }).join('');

      // ── Wishlist button clicks ──
      productGrid.querySelectorAll('.wishlist-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const key   = btn.dataset.key;
          const added = toggleWishlist(key);

          btn.textContent = added ? '♥' : '♡';
          btn.classList.toggle('wishlisted', added);
          btn.title = added ? 'Remove from wishlist' : 'Add to wishlist';

          // Small bounce animation
          btn.style.transform = 'scale(1.3)';
          setTimeout(() => btn.style.transform = '', 200);

          // Update count
          document.getElementById('wishlist-count').textContent = getWishlist().length;

          // If showing wishlist only and item removed — re-render
          if (showWishlistOnly && !added) renderProducts();
        });
      });

      // ── Customize button → go to builder ──
      productGrid.querySelectorAll('.btn-customize').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          window.location.href = `index.html?product=${btn.dataset.key}`;
        });
      });

      // ── Card click → go to builder ──
      productGrid.querySelectorAll('.product-card').forEach(card => {
        card.addEventListener('click', () => {
          window.location.href = `index.html?product=${card.dataset.key}`;
        });
      });
    }

    // ── Search ──
    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value;
      searchClear.style.display = searchQuery ? 'block' : 'none';
      renderProducts();
    });

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      searchClear.style.display = 'none';
      searchInput.focus();
      renderProducts();
    });

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    // ── Init ──
    updateWishlistCount();
    loadRatingsSummary().then(renderProducts);

  </script>

</body>
</html>
