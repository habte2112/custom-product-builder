<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog — Custom Product Builder</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff9900">
  <link rel="stylesheet" href="styles/theme.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #0f0f0f; color: #f0f0f0; min-height: 100vh; }

    /* ── Header ── */
    header { background: #0f0f0f; border-bottom: 1px solid #2a2a2a; padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 2px; color: #ff9900; }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { color: #888; text-decoration: none; font-size: 14px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: #ff9900; }

    /* ── Main ── */
    main { max-width: 1200px; margin: 40px auto; padding: 0 30px; }

    /* ── Top bar ── */ 
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }

    /* ── Wishlist toggle ── */
    .btn-wishlist-toggle { background: none; border: 1px solid #2a2a2a; color: #888; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; gap: 6px; }
    .btn-wishlist-toggle:hover { border-color: #ff9900; color: #ff9900; }
    .btn-wishlist-toggle.active { background: rgba(255,153,0,0.1); border-color: #ff9900; color: #ff9900; }
    .wishlist-count { background: #ff9900; color: #000; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center; }

    /* ── Search ── */
    .search-wrap { position: relative; margin-bottom: 24px; }
    .search-wrap input { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 16px 20px 16px 50px; color: #f0f0f0; font-size: 16px; font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .search-wrap input:focus { border-color: #ff9900; box-shadow: 0 0 0 3px rgba(255,153,0,0.1); }
    .search-wrap input::placeholder { color: #444; }
    .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-size: 18px; pointer-events: none; }
    .search-clear { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #555; font-size: 20px; cursor: pointer; display: none; }
    .search-clear:hover { color: #ff9900; }

    /* ── Filters ── */
    .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
    .filter-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #888; padding: 8px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .filter-btn:hover { border-color: #ff9900; color: #ff9900; }
    .filter-btn.active { background: #ff9900; border-color: #ff9900; color: #000; }

    .results-count { font-size: 13px; color: #555; margin-bottom: 20px; }

    /* ── Product grid ── */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }

    /* ── Product card ── */
    .product-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; position: relative; }
    .product-card:hover { transform: translateY(-4px); border-color: #ff9900; box-shadow: 0 8px 24px rgba(255,153,0,0.15); }

    /* Quick view button on hover */
    .quick-view-btn {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(255,153,0,0.95);
      color: #000;
      border: none;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      opacity: 0;
      transform: translateY(100%);
      transition: all 0.25s ease;
      letter-spacing: 0.5px;
    }

    .product-card:hover .quick-view-btn {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Wishlist heart ── */
    .wishlist-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); border: none; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: all 0.2s; z-index: 2; backdrop-filter: blur(4px); }
    .wishlist-btn:hover { background: rgba(255,153,0,0.3); transform: scale(1.1); }
    .wishlist-btn.wishlisted { background: rgba(229,62,62,0.3); }

    .card-image { width: 100%; height: 180px; object-fit: contain; background: #0f0f0f; padding: 20px; }
    .card-body { padding: 16px; }
    .card-category { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #ff9900; margin-bottom: 6px; }
    .card-name { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; color: #f0f0f0; margin-bottom: 6px; }
    .card-description { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 8px; }
    .card-rating { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .card-stars { color: #ff9900; font-size: 13px; }
    .card-rating-count { font-size: 12px; color: #555; }
    .no-reviews { font-size: 12px; color: #444; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; }
    .card-price { font-size: 20px; font-weight: 700; color: #ff9900; }
    .btn-customize { background: #ff9900; color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; transition: background 0.2s; }
    .btn-customize:hover { background: #ffb84d; }

    /* ── No results / Wishlist empty ── */
    .no-results { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #444; }
    .no-results p:first-child { font-size: 48px; margin-bottom: 16px; }
    .wishlist-empty { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #444; }
    .wishlist-empty .icon { font-size: 48px; margin-bottom: 16px; }
    .wishlist-empty p { font-size: 16px; margin-bottom: 20px; }
    .btn-browse { display: inline-block; background: #ff9900; color: #000; padding: 10px 24px; border-radius: 10px; font-weight: 700; font-size: 14px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.2s; }
    .btn-browse:hover { background: #ffb84d; }

    /* ── Skeleton ── */
    @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    .skeleton-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; overflow: hidden; }
    .skeleton-image { width: 100%; height: 180px; background: linear-gradient(90deg,#1a1a1a 25%,#2a2a2a 50%,#1a1a1a 75%); background-size: 400px 100%; animation: shimmer 1.4s infinite; }
    .skeleton-body { padding: 16px; }
    .skeleton-line { height: 12px; margin-bottom: 10px; background: linear-gradient(90deg,#1a1a1a 25%,#2a2a2a 50%,#1a1a1a 75%); background-size: 400px 100%; animation: shimmer 1.4s infinite; border-radius: 4px; }
    .skeleton-line.short { width: 40%; } .skeleton-line.medium { width: 70%; } .skeleton-line.long { width: 90%; } .skeleton-line.full { width: 100%; }
    .skeleton-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .skeleton-price { width: 60px; height: 20px; background: linear-gradient(90deg,#1a1a1a 25%,#2a2a2a 50%,#1a1a1a 75%); background-size: 400px 100%; animation: shimmer 1.4s infinite; border-radius: 4px; }
    .skeleton-btn { width: 80px; height: 32px; background: linear-gradient(90deg,#1a1a1a 25%,#2a2a2a 50%,#1a1a1a 75%); background-size: 400px 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
    .skeleton-pill { height: 34px; width: 90px; background: linear-gradient(90deg,#1a1a1a 25%,#2a2a2a 50%,#1a1a1a 75%); background-size: 400px 100%; animation: shimmer 1.4s infinite; border-radius: 30px; display: inline-block; }

    /* ══════════════════════════════════════
       QUICK VIEW MODAL
    ══════════════════════════════════════ */
    .qv-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .qv-overlay.show { display: flex; animation: fadeIn 0.25s ease; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .qv-modal {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      width: 100%;
      max-width: 820px;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
      position: relative;
    }

    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* Close button */
    .qv-close {
      position: absolute;
      top: 16px; right: 16px;
      background: #2a2a2a;
      border: none;
      color: #888;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 10;
    }

    .qv-close:hover { background: #e53e3e; color: #fff; }

    /* Modal layout */
    .qv-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    /* Left — image */
    .qv-image-side {
      background: #0f0f0f;
      border-radius: 20px 0 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      min-height: 400px;
    }

    .qv-image {
      width: 100%;
      max-width: 240px;
      height: 240px;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .qv-image:hover { transform: scale(1.05); }

    /* Right — details */
    .qv-details-side { padding: 32px; }

    .qv-category {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ff9900;
      margin-bottom: 8px;
    }

    .qv-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 34px;
      letter-spacing: 2px;
      color: #f0f0f0;
      margin-bottom: 8px;
      line-height: 1.1;
    }

    .qv-rating {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .qv-stars { color: #ff9900; font-size: 18px; }
    .qv-rating-count { color: #555; }

    .qv-price {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px;
      color: #ff9900;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .qv-description {
      font-size: 15px;
      color: #888;
      line-height: 1.7;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid #2a2a2a;
    }

    /* Color & size selectors */
    .qv-option-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 10px;
    }

    .qv-colors { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }

    .qv-color-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .qv-color-btn:hover { transform: scale(1.15); }
    .qv-color-btn.selected { border-color: #ff9900; box-shadow: 0 0 0 2px #ff9900; }

    .qv-sizes { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }

    .qv-size-btn {
      background: #0f0f0f;
      border: 1px solid #333;
      color: #888;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }

    .qv-size-btn:hover { border-color: #ff9900; color: #ff9900; }
    .qv-size-btn.selected { background: #ff9900; border-color: #ff9900; color: #000; }

    /* Actions */
    .qv-actions { display: flex; gap: 12px; }

    .qv-btn-cart {
      flex: 1;
      background: #ff9900;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .qv-btn-cart:hover { background: #ffb84d; transform: translateY(-2px); }
    .qv-btn-cart.added { background: #38a169; }

    .qv-btn-customize {
      background: none;
      border: 1px solid #ff9900;
      color: #ff9900;
      padding: 14px 20px;
      border-radius: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .qv-btn-customize:hover { background: #ff9900; color: #000; }

    .qv-wishlist-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .qv-btn-wishlist {
      background: none;
      border: none;
      color: #555;
      font-size: 14px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      transition: color 0.2s;
    }

    .qv-btn-wishlist:hover { color: #e53e3e; }
    .qv-btn-wishlist.wishlisted { color: #e53e3e; }

    /* Responsive modal */
    @media (max-width: 640px) {
      .qv-content { grid-template-columns: 1fr; }
      .qv-image-side { border-radius: 20px 20px 0 0; min-height: 200px; padding: 24px; }
      .qv-image { height: 160px; }
      .qv-details-side { padding: 20px; }
    }

    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      main   { padding: 0 16px; margin: 24px auto; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Product Catalog</h1>
    <nav class="nav-links" id="main-nav">
      <a href="index.html">Builder</a>
      <a href="catalog.html" class="active">Catalog</a>
      <a href="order-history.html">Orders</a>
    </nav>
  </header>

  <main>
    <div class="top-bar">
      <div></div>
      <button class="btn-wishlist-toggle" id="btn-wishlist-toggle">
        ♡ Wishlist <span class="wishlist-count" id="wishlist-count">0</span>
      </button>
    </div>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search products...">
      <button class="search-clear" id="search-clear">✕</button>
    </div>

    <div class="filter-bar" id="filter-bar">
      <div class="skeleton-pill"></div>
      <div class="skeleton-pill"></div>
      <div class="skeleton-pill"></div>
      <div class="skeleton-pill"></div>
      <div class="skeleton-pill"></div>
    </div>

    <p class="results-count" id="results-count"></p>

    <div class="product-grid" id="product-grid">
      ${[...Array(8)].map(() => `
        <div class="skeleton-card">
          <div class="skeleton-image"></div>
          <div class="skeleton-body">
            <div class="skeleton-line short"></div>
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line long"></div>
            <div class="skeleton-line full"></div>
            <div class="skeleton-footer">
              <div class="skeleton-price"></div>
              <div class="skeleton-btn"></div>
            </div>
          </div>
        </div>`).join('')}
    </div>
  </main>

  <!-- ══════════════════════════════════════
       QUICK VIEW MODAL
  ══════════════════════════════════════ -->
  <div class="qv-overlay" id="qv-overlay">
    <div class="qv-modal" id="qv-modal">
      <button class="qv-close" id="qv-close">✕</button>
      <div class="qv-content">

        <!-- Image side -->
        <div class="qv-image-side">
          <img class="qv-image" id="qv-image" src="" alt="">
        </div>

        <!-- Details side -->
        <div class="qv-details-side">
          <div class="qv-category"  id="qv-category"></div>
          <div class="qv-name"      id="qv-name"></div>

          <div class="qv-rating">
            <span class="qv-stars"        id="qv-stars"></span>
            <span class="qv-rating-count" id="qv-rating-count"></span>
          </div>

          <div class="qv-price"       id="qv-price"></div>
          <div class="qv-description" id="qv-description"></div>

          <!-- Color selector -->
          <div class="qv-option-label">Color</div>
          <div class="qv-colors" id="qv-colors"></div>

          <!-- Size selector -->
          <div class="qv-option-label">Size</div>
          <div class="qv-sizes" id="qv-sizes"></div>

          <!-- Actions -->
          <div class="qv-actions">
            <button class="qv-btn-cart"      id="qv-btn-cart">Add to Cart</button>
            <button class="qv-btn-customize" id="qv-btn-customize">Customize →</button>
          </div>

          <!-- Wishlist -->
          <div class="qv-wishlist-row">
            <button class="qv-btn-wishlist" id="qv-btn-wishlist">
              <span id="qv-heart">♡</span> Add to Wishlist
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module">
    import { products, categories } from './scripts/products.js';
    import { cart, addToCart, getCartQuantity } from './scripts/cart.js';
    import { setupNav }  from './scripts/admin-nav.js';
    import { initTheme } from './scripts/theme.js';
    import { initPWA }   from './scripts/pwa.js';

    initTheme('#main-nav');
    setupNav();
    initPWA();

    const API = 'https://custom-product-backend-production.up.railway.app/api';

    const searchInput       = document.getElementById('search-input');
    const searchClear       = document.getElementById('search-clear');
    const filterBar         = document.getElementById('filter-bar');
    const productGrid       = document.getElementById('product-grid');
    const resultsCount      = document.getElementById('results-count');
    const btnWishlistToggle = document.getElementById('btn-wishlist-toggle');

    let activeCategory   = 'all';
    let searchQuery      = '';
    let ratingSummary    = {};
    let showWishlistOnly = false;
    let currentProduct   = null; // for quick view
    let selectedColor    = 'red';
    let selectedSize     = 'medium';

    // ══════════════════════════════════════
    // WISHLIST
    // ══════════════════════════════════════
    function getWishlist()      { return JSON.parse(localStorage.getItem('wishlist') || '[]'); }
    function saveWishlist(list) { localStorage.setItem('wishlist', JSON.stringify(list)); updateWishlistCount(); }

    function toggleWishlist(key) {
      const list = getWishlist();
      const idx  = list.indexOf(key);
      if (idx === -1) list.push(key); else list.splice(idx, 1);
      saveWishlist(list);
      return idx === -1;
    }

    function updateWishlistCount() {
      document.getElementById('wishlist-count').textContent = getWishlist().length;
    }

    btnWishlistToggle.addEventListener('click', () => {
      showWishlistOnly = !showWishlistOnly;
      btnWishlistToggle.classList.toggle('active', showWishlistOnly);
      btnWishlistToggle.innerHTML = `${showWishlistOnly ? '♥' : '♡'} Wishlist <span class="wishlist-count" id="wishlist-count">${getWishlist().length}</span>`;
      renderProducts();
    });

    // ══════════════════════════════════════
    // RATINGS
    // ══════════════════════════════════════
    function starsString(avg) {
      const full = Math.floor(avg);
      const half = avg % 1 >= 0.5 ? 1 : 0;
      return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(5 - full - half);
    }

    function ratingBadge(key) {
      const r = ratingSummary[key];
      if (!r || r.count === 0) return `<div class="card-rating"><span class="no-reviews">No reviews yet</span></div>`;
      return `<div class="card-rating"><span class="card-stars">${starsString(r.avg)}</span><span class="card-rating-count">${r.avg} (${r.count})</span></div>`;
    }

    async function loadRatingsSummary() {
      try {
        const res  = await fetch(`${API}/reviews/summary`);
        const data = await res.json();
        ratingSummary = data.summary || {};
      } catch { ratingSummary = {}; }
    }

    // ══════════════════════════════════════
    // QUICK VIEW MODAL
    // ══════════════════════════════════════
    const qvOverlay     = document.getElementById('qv-overlay');
    const qvClose       = document.getElementById('qv-close');
    const colors        = ['red','blue','black','white','green'];
    const sizes         = ['small','medium','large','xl'];
    const colorMap      = { red:'#e53e3e', blue:'#3182ce', black:'#1a1a1a', white:'#f0f0f0', green:'#38a169' };

    function openQuickView(key, product) {
      currentProduct = { key, product };
      selectedColor  = 'red';
      selectedSize   = 'medium';

      const r = ratingSummary[key];

      document.getElementById('qv-image').src          = product.image;
      document.getElementById('qv-image').alt          = product.label;
      document.getElementById('qv-category').textContent = product.category;
      document.getElementById('qv-name').textContent   = product.label;
      document.getElementById('qv-price').textContent  = `$${product.price.toFixed(2)}`;
      document.getElementById('qv-description').textContent = product.description;

      // Rating
      if (r && r.count > 0) {
        document.getElementById('qv-stars').textContent        = starsString(r.avg);
        document.getElementById('qv-rating-count').textContent = `${r.avg} (${r.count} reviews)`;
      } else {
        document.getElementById('qv-stars').textContent        = '☆☆☆☆☆';
        document.getElementById('qv-rating-count').textContent = 'No reviews yet';
      }

      // Color buttons
      const colorsEl = document.getElementById('qv-colors');
      colorsEl.innerHTML = colors.map(c => `
        <button class="qv-color-btn ${c === selectedColor ? 'selected' : ''}"
          data-color="${c}"
          style="background:${colorMap[c] || '#888'};border-color:${c === 'white' ? '#555' : 'transparent'};"
          title="${c}">
        </button>`).join('');

      colorsEl.querySelectorAll('.qv-color-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedColor = btn.dataset.color;
          colorsEl.querySelectorAll('.qv-color-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        });
      });

      // Size buttons
      const sizesEl = document.getElementById('qv-sizes');
      sizesEl.innerHTML = sizes.map(s => `
        <button class="qv-size-btn ${s === selectedSize ? 'selected' : ''}" data-size="${s}">
          ${s.toUpperCase()}
        </button>`).join('');

      sizesEl.querySelectorAll('.qv-size-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedSize = btn.dataset.size;
          sizesEl.querySelectorAll('.qv-size-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        });
      });

      // Wishlist button
      const wishBtn  = document.getElementById('qv-btn-wishlist');
      const heartEl  = document.getElementById('qv-heart');
      const isWished = getWishlist().includes(key);
      heartEl.textContent  = isWished ? '♥' : '♡';
      wishBtn.textContent  = '';
      wishBtn.appendChild(heartEl);
      wishBtn.appendChild(document.createTextNode(isWished ? ' Remove from Wishlist' : ' Add to Wishlist'));
      wishBtn.classList.toggle('wishlisted', isWished);

      wishBtn.onclick = () => {
        const added = toggleWishlist(key);
        heartEl.textContent = added ? '♥' : '♡';
        wishBtn.className   = `qv-btn-wishlist${added ? ' wishlisted' : ''}`;
        // Update card heart too
        const cardBtn = productGrid.querySelector(`.wishlist-btn[data-key="${key}"]`);
        if (cardBtn) {
          cardBtn.textContent = added ? '♥' : '♡';
          cardBtn.classList.toggle('wishlisted', added);
        }
      };

      // Add to cart button
      const cartBtn = document.getElementById('qv-btn-cart');
      cartBtn.textContent = 'Add to Cart';
      cartBtn.className   = 'qv-btn-cart';

      cartBtn.onclick = () => {
        addToCart(product.id, selectedColor, selectedSize);
        cartBtn.textContent = '✅ Added!';
        cartBtn.classList.add('added');
        setTimeout(() => {
          cartBtn.textContent = 'Add to Cart';
          cartBtn.classList.remove('added');
        }, 1500);
      };

      // Customize button
      document.getElementById('qv-btn-customize').onclick = () => {
        window.location.href = `index.html?product=${key}`;
      };

      // Show modal
      qvOverlay.classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeQuickView() {
      qvOverlay.classList.remove('show');
      document.body.style.overflow = '';
      currentProduct = null;
    }

    qvClose.addEventListener('click', closeQuickView);
    qvOverlay.addEventListener('click', (e) => {
      if (e.target === qvOverlay) closeQuickView();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeQuickView();
    });

    // ══════════════════════════════════════
    // FILTERS
    // ══════════════════════════════════════
    function buildFilters() {
      filterBar.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className        = 'filter-btn' + (cat === 'all' ? ' active' : '');
        btn.textContent      = cat === 'all' ? 'All Products' : capitalize(cat);
        btn.dataset.category = cat;
        btn.addEventListener('click', () => {
          activeCategory   = cat;
          showWishlistOnly = false;
          btnWishlistToggle.classList.remove('active');
          btnWishlistToggle.innerHTML = `♡ Wishlist <span class="wishlist-count" id="wishlist-count">${getWishlist().length}</span>`;
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderProducts();
        });
        filterBar.appendChild(btn);
      });
    }

    // ══════════════════════════════════════
    // RENDER PRODUCTS
    // ══════════════════════════════════════
    function renderProducts() {
      const query    = searchQuery.toLowerCase().trim();
      const wishlist = getWishlist();

      const filtered = Object.entries(products).filter(([key, product]) => {
        const matchCat   = activeCategory === 'all' || product.category === activeCategory;
        const matchSearch= !query || product.label.toLowerCase().includes(query) || product.category.toLowerCase().includes(query) || product.description.toLowerCase().includes(query);
        const matchWish  = !showWishlistOnly || wishlist.includes(key);
        return matchCat && matchSearch && matchWish;
      });

      resultsCount.textContent = showWishlistOnly
        ? `${filtered.length} wishlisted product${filtered.length !== 1 ? 's' : ''}`
        : `${filtered.length} product${filtered.length !== 1 ? 's' : ''} found`;

      if (showWishlistOnly && filtered.length === 0) {
        productGrid.innerHTML = `
          <div class="wishlist-empty">
            <div class="icon">♡</div>
            <p>Your wishlist is empty.<br>Click ♡ on any product to save it!</p>
            <button class="btn-browse" onclick="document.getElementById('btn-wishlist-toggle').click()">Browse Products</button>
          </div>`;
        return;
      }

      if (filtered.length === 0) {
        productGrid.innerHTML = `<div class="no-results"><p>🔍</p><p>No products found for "<strong>${query}</strong>"</p></div>`;
        return;
      }

      productGrid.innerHTML = filtered.map(([key, product]) => {
        const wishlisted = wishlist.includes(key);
        return `
          <div class="product-card" data-key="${key}">
            <button class="wishlist-btn ${wishlisted ? 'wishlisted' : ''}" data-key="${key}" title="${wishlisted ? 'Remove' : 'Add to wishlist'}">
              ${wishlisted ? '♥' : '♡'}
            </button>
            <img class="card-image" src="${product.image}" alt="${product.label}" onerror="this.src='images/products/backpack.jpg'">
            <div class="card-body">
              <div class="card-category">${product.category}</div>
              <div class="card-name">${product.label}</div>
              <div class="card-description">${product.description}</div>
              ${ratingBadge(key)}
              <div class="card-footer">
                <span class="card-price">$${product.price.toFixed(2)}</span>
                <button class="btn-customize" data-key="${key}">Customize →</button>
              </div>
            </div>
            <!-- Quick View button appears on hover -->
            <button class="quick-view-btn" data-key="${key}">👁 Quick View</button>
          </div>`;
      }).join('');

      // Wishlist buttons
      productGrid.querySelectorAll('.wishlist-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const key   = btn.dataset.key;
          const added = toggleWishlist(key);
          btn.textContent = added ? '♥' : '♡';
          btn.classList.toggle('wishlisted', added);
          btn.style.transform = 'scale(1.3)';
          setTimeout(() => btn.style.transform = '', 200);
          document.getElementById('wishlist-count').textContent = getWishlist().length;
          if (showWishlistOnly && !added) renderProducts();
        });
      });

      // Quick View buttons
      productGrid.querySelectorAll('.quick-view-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const key     = btn.dataset.key;
          const product = products[key];
          if (product) openQuickView(key, product);
        });
      });

      // Customize buttons
      productGrid.querySelectorAll('.btn-customize').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          window.location.href = `index.html?product=${btn.dataset.key}`;
        });
      });

      // Card clicks → quick view
      productGrid.querySelectorAll('.product-card').forEach(card => {
        card.addEventListener('click', () => {
          const key     = card.dataset.key;
          const product = products[key];
          if (product) openQuickView(key, product);
        });
      });
    }

    // ── Search ──
    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value;
      searchClear.style.display = searchQuery ? 'block' : 'none';
      renderProducts();
    });

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery       = '';
      searchClear.style.display = 'none';
      searchInput.focus();
      renderProducts();
    });

    function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

    // ── Init ──
    async function init() {
      await loadRatingsSummary();
      buildFilters();
      renderProducts();
      updateWishlistCount();
    }

    init();
  </script>

</body>
</html>
