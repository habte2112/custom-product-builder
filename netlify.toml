# ─────────────────────────────────────────
# Netlify Configuration — Product Builder
# ─────────────────────────────────────────

# ── Redirect 404s to custom page ──
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# ── Cache: Service Worker — never cache (must always be fresh) ──
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"
    Expires       = "0"

# ── Cache: HTML pages — no cache (always fresh) ──
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Cache: JavaScript — 1 year (immutable) ──
[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Cache: CSS — 1 year ──
[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Cache: Images — 1 year ──
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Cache: Fonts — 1 year ──
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers (all pages) ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"